# Example PrometheusRule / alerting rules for terraplan.
# Apply via your Prometheus Operator or alertmanager config.
groups:
  - name: terraplan
    rules:
      - alert: TerraplanApiDown
        expr: terraplan_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: terraplan API is down
      - alert: TerraplanFailSpike
        expr: terraplan_runs_failed_last_hour > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated terraform run failures
      - alert: TerraplanApprovalBacklog
        expr: terraplan_runs_waiting_approval > 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Many runs waiting for approval
      - alert: TerraplanRedisDown
        expr: terraplan_redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: terraplan Redis is unreachable
