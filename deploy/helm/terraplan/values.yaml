# Default values for terraplan on EKS.
nameOverride: ""
fullnameOverride: ""

image:
  registry: ""
  pullPolicy: IfNotPresent
  web:
    repository: terraplan/web
    tag: "0.1.0"
  api:
    repository: terraplan/api
    tag: "0.1.0"
  runner:
    repository: terraplan/runner
    tag: "0.1.0"

imagePullSecrets: []

# Shared non-secret config (also set via ConfigMap).
config:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGIN: "https://terraplan.example.com"
  WEB_PUBLIC_URL: "https://terraplan.example.com"
  API_PUBLIC_URL: "https://api.terraplan.example.com"
  API_INTERNAL_URL: "http://terraplan-api:4000"
  RATE_LIMIT_RUNS_PER_HOUR: "30"
  USER_MAX_CONCURRENT_RUNS: "3"
  RUN_TIMEOUT_SECONDS: "3600"
  SECRET_SCAN_FAIL_ON_HIGH: "true"
  NOTIFY_ON: "waiting_approval,failed,succeeded"
  METRICS_ENABLED: "true"
  RUNNER_MODE: terraform
  RUNNER_CONCURRENCY: "2"
  ARTIFACTS_S3_REGION: us-east-1
  ARTIFACTS_S3_PREFIX: terraplan/
  TF_DENIED_FLAGS: ""

# Create a Kubernetes Secret named by secretName, or bring your own.
# Required keys: SESSION_SECRET, DATABASE_URL, REDIS_URL
# Optional: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SLACK_WEBHOOK_URL,
#           TEAMS_WEBHOOK_URL, CREDENTIALS_ENCRYPTION_KEY, ARTIFACTS_S3_BUCKET
secretName: terraplan
createSecret: false
secrets: {}

web:
  replicas: 2
  port: 3005
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  service:
    type: ClusterIP
    port: 80

api:
  replicas: 2
  port: 4000
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  service:
    type: ClusterIP
    port: 80
  metrics:
    enabled: true
    path: /api/v1/metrics
    scrapeInterval: 30s

runner:
  replicas: 2
  healthPort: 4100
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
  # IRSA annotation for S3 artifacts + STS assume-role
  serviceAccount:
    create: true
    name: terraplan-runner
    annotations: {}
      # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/terraplan-runner

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/aws-load-balancer-type: external
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: terraplan.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: api.terraplan.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
  tls: []

# Optional in-cluster Postgres/Redis for non-prod. Prefer RDS + ElastiCache in prod.
postgresql:
  enabled: false
redis:
  enabled: false

podSecurityContext:
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

nodeSelector: {}
tolerations: []
affinity: {}
